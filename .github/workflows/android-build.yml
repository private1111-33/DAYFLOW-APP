name: Build DAYFLOW debug APK and UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    # A screenshot failure must not turn the whole run red: the APK is already built.
    continue-on-error: true
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: DAYFLOW-debug-apk
          path: apk
      - name: Run app on Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p screenshots
            adb install -g apk/app-debug.apk
            adb shell monkey -p com.dayflow.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell screencap -p /sdcard/home.png
            adb pull /sdcard/home.png screenshots/01-home.png
            adb shell input tap 324 2250
            sleep 2
            adb shell screencap -p /sdcard/planner.png
            adb pull /sdcard/planner.png screenshots/02-planner.png
            adb shell input tap 540 2250
            sleep 2
            adb shell screencap -p /sdcard/alarms.png
            adb pull /sdcard/alarms.png screenshots/03-alarms.png
            adb shell input tap 756 2250
            sleep 2
            adb shell screencap -p /sdcard/vocabulary.png
            adb pull /sdcard/vocabulary.png screenshots/04-vocabulary.png
            adb shell input tap 972 2250
            sleep 3
            adb shell screencap -p /sdcard/music.png
            adb pull /sdcard/music.png screenshots/05-music.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-ui-screenshots
          path: screenshots/*.png
